name: build and deploy container

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  service:
    uses: kubernetes-mail-server/.github/.github/workflows/service.yml@main
    secrets: inherit
    with:
      name: database
      kind: statefulset
      # The Job is immutable and complete; a fresh one runs the migrations with the new image.
      before-deploy: kubectl -n mail-server delete job migrations --ignore-not-found
      after-deploy: kubectl -n mail-server wait --for=condition=complete job/migrations --timeout=10m
      helm-args: >-
        --set database_size=$(kubectl get cm -n mail-server general -o=jsonpath="{.data.DATABASE_SIZE}")
        --set port=$(kubectl get cm -n mail-server database-common -o=jsonpath="{.data.DATABASE_PORT}")
